<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Blueprint drafting sheet: one wide working stage per lesson, lesson tabs as a title-block strip. Single dark look by choice. */
  :root {
    --bg: #071528;
    --panel: #0b1f3a;
    --text: #e6f0ff;
    --muted: #9db3d1;
    --accent: #4cc9f0;
    --amber: #ffc857;
    --line: #24497a;
    --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); }
  body {
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(76, 201, 240, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76, 201, 240, 0.045) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; gap: 8px 28px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 10px; }
  h1 { font-family: var(--display); font-size: 30px; margin: 0; font-weight: 700; letter-spacing: 0.3px; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .stamp { font-family: var(--mono); font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); padding: 6px 10px; line-height: 1.5; letter-spacing: 0.4px; text-transform: uppercase; }
  .stamp b { color: var(--accent); font-weight: 500; }
  nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(__NAVW__px, 1fr)); gap: 6px; margin: 10px 0 14px; }
  nav button { font: inherit; text-align: left; cursor: pointer; background: rgba(11, 31, 58, 0.7); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; min-width: 0; }
  nav button b { display: block; color: var(--text); font-weight: 600; font-size: 13.5px; font-family: var(--display); letter-spacing: 0.2px; }
  nav button span { font-family: var(--mono); font-size: 10.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav button.on { border-color: var(--accent); background: rgba(76, 201, 240, 0.13); }
  nav button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  nav .deck { grid-column: 1 / -1; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
  .err { white-space: pre-wrap; font-family: var(--mono); font-size: 13px; color: var(--amber); border: 1px dashed var(--amber); padding: 12px; border-radius: 4px; }
  .loading { color: var(--muted); font-family: var(--mono); padding: 30px; }
  footer a { color: var(--accent); }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 22px; line-height: 1.55; border-top: 1px solid var(--line); padding-top: 10px; max-width: 900px; }
  input[type=range] { accent-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
</style>
<div class="wrap">
  <header>
    <div>
      <h1>__TITLE__</h1>
      <div class="sub">__SUB__</div>
    </div>
    <div class="stamp">__STAMP__</div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer>
    __FOOTER__
    <br><a href="__HOME__">← all labs</a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<!--__SOURCES__-->

<script>
(function () {
  var LESSONS = /*__LESSONS__*/;
  var DECKS = /*__DECKS__*/;
  var h = React.createElement;
  var cache = {};
  var nav = document.getElementById("nav");
  var main = document.getElementById("main");

  function showError(msg) {
    var d = document.createElement("div");
    d.className = "err";
    d.id = "fatal-error";
    d.textContent = msg;
    main.prepend(d);
  }
  window.addEventListener("error", function (e) { showError("Error: " + (e.message || e)); });

  if (!window.React || !window.ReactDOM) {
    showError("Could not load React from the CDN. Check the internet connection and reload.");
    return;
  }

  function load(id) {
    if (!cache[id]) cache[id] = window.__LESSON_SRC[id]();
    return cache[id];
  }

  class Boundary extends React.Component {
    constructor(p) { super(p); this.state = { err: null }; }
    static getDerivedStateFromError(err) { return { err: err }; }
    render() {
      if (this.state.err) return h("div", { className: "err", id: "lesson-error" }, "Lesson crashed: " + String(this.state.err && this.state.err.stack || this.state.err));
      return this.props.children;
    }
  }

  var roots = {};
  var mounted = {};
  function parseHash() {
    var raw = (location.hash || "").replace(/^#/, "");
    var m = raw.match(/^([a-z]+)(?:-(\d))?$/) || [];
    var id = LESSONS.some(function (l) { return l.id === m[1]; }) ? m[1] : LESSONS[0].id;
    var screen = m[2] ? Math.max(0, Math.min(3, parseInt(m[2], 10) - 1)) : null;
    return { id: id, screen: screen };
  }

  function render() {
    var st = parseHash();
    nav.innerHTML = "";
    LESSONS.forEach(function (l) {
      if (DECKS[l.n]) {
        var d = document.createElement("div");
        d.className = "deck";
        d.textContent = DECKS[l.n];
        nav.appendChild(d);
      }
      var b = document.createElement("button");
      b.className = l.id === st.id ? "on" : "";
      b.innerHTML = "<span>" + l.n + " · " + l.sub + "</span><b>" + l.title + "</b>";
      b.onclick = function () { location.hash = l.id; };
      nav.appendChild(b);
    });
    LESSONS.forEach(function (l) {
      var box = document.getElementById("box-" + l.id);
      if (box) box.hidden = l.id !== st.id;
    });
    var key = st.screen == null ? null : st.id + ":" + st.screen;
    if (!roots[st.id] || (key && mounted[st.id] !== key)) {
      var box = document.getElementById("box-" + st.id);
      if (!box) {
        box = document.createElement("div");
        box.id = "box-" + st.id;
        box.innerHTML = '<div class="loading">loading lesson...</div>';
        main.appendChild(box);
      }
      if (roots[st.id]) { roots[st.id].unmount(); }
      var Comp;
      try { Comp = load(st.id); } catch (e) { showError("Could not start lesson " + st.id + ":\n" + e.message); return; }
      roots[st.id] = ReactDOM.createRoot(box);
      roots[st.id].render(h(Boundary, null, h(Comp, { initialScreen: st.screen == null ? 0 : st.screen })));
      mounted[st.id] = key || st.id + ":0";
    }
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
